<div class="form-grid">
  <label>Host <input name="host" value="localhost"></label>
  <label>Port <input type="number" name="port" value="{{ cfg.port }}" min="1" max="65535"></label>
  <label>Called AE title <input name="called_ae" value="{{ cfg.ae_title }}" maxlength="16"></label>
  <label>Calling AE title <input name="calling_ae" value="DICOMSTORE-SCU" maxlength="16"></label>
  <label>Concurrency <input type="number" name="concurrency" value="1" min="1" max="16"></label>
  <label>Delay between images (ms) <input type="number" name="delay_ms" value="0" min="0" max="5000"></label>
  <label>Max images/sec (0 = unlimited) <input type="number" name="max_per_second" value="0" min="0" max="10000"></label>
</div>
